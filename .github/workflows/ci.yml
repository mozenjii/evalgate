# What this runs, and what it does not.
#
# It runs `tools/check.py`, the same command I run before committing: format, lint,
# types, documentation links, and tests against a coverage floor. Nothing here is a
# CI-only gate, and nothing I run locally is missing here. A check that exists in one
# place and not the other gets out of sync within a month and then gets switched off.
#
# Not gated yet, so that the absence is a decision and not an oversight:
#
#   - Anything calling a model. No provider interface exists yet, and when it does,
#     CI will replay recorded calls rather than make live ones.
#   - Redaction, a no-egress default and a budget cap on model calls. CI handles no
#     real data until those exist, which is why the datasets here are synthetic.
#   - The pull-request comment. The action job below runs the whole check on every push,
#     but with comments off: a push has no pull request to comment on.
#   - Accessibility and performance budgets. They need a URL, and there is no UI.
#
# The matrix is the pinned interpreter plus the oldest version the package claims to
# support, because `requires-python = ">=3.11"` is a promise and an untested promise
# is a guess.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install the locked environment
        # --locked fails rather than silently resolving something new, so a drifting
        # lockfile is a red build and not a surprise in someone else's checkout.
        run: uv sync --all-groups --locked --python ${{ matrix.python-version }}

      - name: Run the gates
        run: uv run python tools/check.py

  # A gate that has never failed is not known to work. This injects one deliberate fault
  # per gate and requires each gate to catch it, then confirms the tree is green again.
  # It runs on one interpreter because it is testing the gates, not the runtime.
  gates-are-connected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --all-groups --locked --python 3.12

      - name: Make every gate fail on purpose
        run: uv run python tools/verify_gates.py

  # Kept out of `check` because it queries a remote advisory database. A gate that needs the
  # network fails for reasons that have nothing to do with the change, and a gate that fails
  # for unrelated reasons gets ignored and then switched off.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --all-groups --locked --python 3.12

      # Audits the locked dependencies rather than the installed environment, so what is
      # checked is exactly what is pinned. The project itself is excluded: it is not published,
      # so there is no advisory feed for it, and --strict would otherwise fail on that alone.
      - name: Export the locked dependencies
        run: >
          uv export --no-emit-project --all-groups --no-hashes
          --format requirements-txt -o requirements-audit.txt

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit --strict --no-deps -r requirements-audit.txt

  # Runs this repository's own action against the example, the way a user's workflow would:
  # installed from source into a plain Python, base and head checked out separately. The
  # example is unchanged between the two, so the verdict is "not guarded" under a warn policy
  # and the step exits 0. The second step then checks the installed command still catches the
  # example's seeded regression.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the action against this commit
        uses: ./
        with:
          config: examples/triage/evalgate.toml
          base-ref: ${{ github.sha }}
          comment: "false"

      - name: The installed command finds the seeded regression
        run: |
          config=examples/triage/evalgate.toml
          python -m evalgate.cli run --config "$config" --label v1 --out v1.jsonl --quiet
          python -m evalgate.cli run --config "$config" --label v2 --out v2.jsonl --quiet \
            --target target:classify_v2
          set +e
          python -m evalgate.cli compare v1.jsonl v2.jsonl --config "$config"
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 (regressed), got $code"
            exit 1
          fi
